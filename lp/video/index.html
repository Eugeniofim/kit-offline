<link rel="apple-touch-icon" href="../../icone-192.png">
<style>
  :root{ --linha:#262d36; --texto:#f3efe8; --fraco:#a3abb5; --sinal:#ff8a1f; --sinalTexto:#1a0d00 }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:radial-gradient(90vmax 70vmax at 50% 20%, rgba(255,138,31,.16), transparent 60%) #000; color:var(--texto);
    font:17px/1.5 ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
    display:flex; flex-direction:column; align-items:center; gap:14px;
    padding:calc(env(safe-area-inset-top, 0px) + 14px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
    min-height:100svh;
  }
  :focus-visible{outline:2px solid var(--sinal); outline-offset:3px; border-radius:6px}
  .marca{display:flex; align-items:center; gap:10px; font-weight:700; color:inherit; text-decoration:none; min-height:44px}
  .farol{width:10px; height:10px; border-radius:50%; background:var(--sinal); box-shadow:0 0 0 4px rgba(255,138,31,.2)}
  .quadro{flex:1 1 auto; min-height:0; width:100%; display:flex; justify-content:center}
  video{height:100%; max-height:min(74svh, 760px); max-width:100%; aspect-ratio:9 / 16; border-radius:22px; background:#000;
    border:1px solid var(--linha); box-shadow:0 30px 90px -20px rgba(255,138,31,.35)}
  .acoes{display:flex; flex-wrap:wrap; justify-content:center; gap:10px; width:100%; max-width:440px}
  .btn{flex:1 1 auto; display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:56px; padding:0 22px;
    border-radius:16px; border:1px solid var(--linha); background:rgba(21,26,32,.82); color:var(--texto);
    font-weight:700; text-decoration:none}
  .btn.pri{background:var(--sinal); border-color:var(--sinal); color:var(--sinalTexto); box-shadow:0 10px 40px -8px rgba(255,138,31,.55)}
  .btn svg{width:22px; height:22px; flex:none; stroke:currentColor; fill:none; stroke-width:2.1; stroke-linecap:round; stroke-linejoin:round}
  .mini{margin:0; font-size:13px; color:var(--fraco); text-align:center; max-width:440px}
</style>
</head>
<body>

<a class="marca" href="../"><span class="farol" aria-hidden="true"></span>Kit Sobrevivência Offline</a>

<div class="quadro">
  <video controls playsinline preload="metadata" poster="capa.jpg" aria-label="Vídeo: Kit Sobrevivência Offline em menos de um minuto">
    <source src="kit-offline.mp4" type="video/mp4">
  </video>
</div>

<div class="acoes">
  <a class="btn pri" href="../../">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></svg>
    Baixar grátis
  </a>
  <a class="btn" href="../">Como funciona</a>
</div>
<p class="mini">Versão de teste. A IA pode errar e não substitui socorro. Em emergência, ligue 192 ou 193.</p>

</body>
</html>
